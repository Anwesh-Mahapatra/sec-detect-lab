inputs:
  k8s_audit:
    disabled: false
    sendToRoutes: true
    pqEnabled: false
    streamtags: []
    brokers:
      - kafka:29092
    topics:
      - logs.k8s-audit
    groupId: cribl-logpipe
    fromBeginning: true
    kafkaSchemaRegistry:
      disabled: true
    connectionTimeout: 10000
    requestTimeout: 60000
    maxRetries: 5
    maxBackOff: 30000
    initialBackoff: 300
    backoffRate: 2
    authenticationTimeout: 10000
    reauthenticationThreshold: 10000
    sasl:
      disabled: true
    tls:
      disabled: true
    sessionTimeout: 30000
    rebalanceTimeout: 60000
    heartbeatInterval: 3000
    # HARD CEILING: the Cribl Kafka source schema rejects anything above
    # 10000000 with CrudEntityInvalidError "should be <= 10000000". Exceeding it
    # does not clamp - the source fails to initialize, so the consumer group has
    # zero members and the topic silently accumulates lag. This is the tightest
    # hop in the chain and therefore the real end-to-end event ceiling; the
    # Fluent Bit tail Buffer_Max_Size (8MB) must stay below it.
    maxBytesPerPartition: 10000000
    maxBytes: 10000000
    maxSocketErrors: 0
    type: kafka
    pipeline: pre_processing_k8s_audit_log_kafka_topic_source
