inputs:
  k8s_audit:
    disabled: false
    sendToRoutes: true
    pqEnabled: false
    streamtags: []
    brokers:
      - kafka:29092
    topics:
      - logs.k8s-audit
    groupId: cribl-logpipe
    fromBeginning: true
    kafkaSchemaRegistry:
      disabled: true
    connectionTimeout: 10000
    requestTimeout: 60000
    maxRetries: 5
    maxBackOff: 30000
    initialBackoff: 300
    backoffRate: 2
    authenticationTimeout: 10000
    reauthenticationThreshold: 10000
    sasl:
      disabled: true
    tls:
      disabled: true
    sessionTimeout: 30000
    rebalanceTimeout: 60000
    heartbeatInterval: 3000
    maxBytesPerPartition: 1048576
    maxBytes: 10485760
    maxSocketErrors: 0
    type: kafka
    pipeline: pre_processing_k8s_audit_log_kafka_topic_source
