name: detections

on:
  pull_request:
    paths: ["detections/**", "tests/**", "tools/**"]
  push:
    branches: [main]
    paths: ["detections/**", "tests/**", "tools/**"]

jobs:
  # ---------------------------------------------------------------------------
  # Gate 1 - logic. No OpenSearch needed, so this is seconds, not minutes.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Unit tests, metadata and schema contract
        run: python -m pytest tests/ -v

  # ---------------------------------------------------------------------------
  # Gate 2 - the query really is valid against a real OpenSearch, not just
  # well-formed JSON. Catches painless script errors and analyzer surprises
  # that a mapping snapshot cannot.
  # ---------------------------------------------------------------------------
  validate-against-opensearch:
    runs-on: ubuntu-latest
    needs: test
    services:
      opensearch:
        image: opensearchproject/opensearch:2.19.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health"
          --health-interval 10s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Create index with the production mapping
        run: |
          curl -sf -X PUT localhost:9200/_index_template/logs-k8s-audit \
            -H 'Content-Type: application/json' \
            -d @opensearch/index-template.json
          curl -sf -X PUT localhost:9200/logs-k8s-audit

      - name: Load every fixture as a real document
        run: python tools/load_fixtures.py --url http://localhost:9200

      - name: Every rule's query must execute and find its true positives
        run: python tools/validate_queries.py --url http://localhost:9200

      - name: Monitors must render and deploy cleanly
        run: python tools/deploy.py --url http://localhost:9200

  # ---------------------------------------------------------------------------
  # Gate 3 - deploy. Only on main, only after both gates pass.
  # ---------------------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: [test, validate-against-opensearch]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Sync monitors to OpenSearch
        env:
          OPENSEARCH_URL: ${{ secrets.OPENSEARCH_URL }}
        run: python tools/deploy.py --url "$OPENSEARCH_URL"
