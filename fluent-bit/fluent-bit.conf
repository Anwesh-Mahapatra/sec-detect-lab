# ============================================================================
# Fluent Bit — edge collector for sec-detect-lab (Phase 2)
# Sources: REAL K8s audit log + host syslog  ->  Kafka (dual topics)
# Contract: never silently drop (Retry_Limit no_limits), buffer on disk
# (storage.type filesystem), broker must durably confirm (acks=all).
#
# WARNING: classic config mode does NOT support inline comments.
# Anything after a value becomes PART of the value. Comments go on their
# own lines, always.
# ============================================================================

[SERVICE]
    Flush                     1
    Daemon                    Off
    Log_Level                 info
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020
    Parsers_File              parsers.conf
    storage.path              /var/log/flb-storage/
    storage.sync              normal
    storage.checksum          On
    storage.max_chunks_up     128
    storage.backlog.mem_limit 50M

# --- Source 1: REAL Kubernetes audit events ---
# Prereq: API server audit logging enabled (audit-policy-file + audit-log-path).
# Mount the host audit dir into the container at /k8s-audit (ro).
# If audit.log does not exist yet, tail simply waits for it. No crash.
[INPUT]
    Name              tail
    Tag               k8s.audit
    Path              /k8s-audit/audit.log
    Parser            json
    Path_Key          log_file
    DB                /var/log/flb-storage/k8s-audit.db
    Read_From_Head    On
    Skip_Long_Lines   On
    Refresh_Interval  5
    storage.type      filesystem

# --- Source 2: real host telemetry ---
# If /var/log/syslog does not exist on the host, point Path at
# /host-logs/kern.log instead. Check with: ls /var/log
[INPUT]
    Name              tail
    Tag               host.syslog
    Path              /host-logs/syslog
    Path_Key          log_file
    DB                /var/log/flb-storage/syslog.db
    Read_From_Head    On
    Skip_Long_Lines   On
    storage.type      filesystem

[FILTER]
    Name    record_modifier
    Match   *
    Record  lab_node pop-os-vm
    Record  env     lab

[OUTPUT]
    Name              kafka
    Match             k8s.audit
    Brokers           kafka:29092
    Topics            logs.k8s-audit
    Timestamp_Format  iso8601
    Retry_Limit       no_limits
    rdkafka.request.required.acks  all
    rdkafka.compression.type       lz4
    rdkafka.queue.buffering.max.ms 100
    rdkafka.message.timeout.ms 0

[OUTPUT]
    Name              kafka
    Match             host.syslog
    Brokers           kafka:29092
    Topics            logs.host-syslog
    Timestamp_Format  iso8601
    Retry_Limit       no_limits
    rdkafka.request.required.acks  all
    rdkafka.compression.type       lz4
    rdkafka.message.timeout.ms 0
